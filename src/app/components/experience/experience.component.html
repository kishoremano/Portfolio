<section id="experience" class="experience">
  <div class="section-header" motionFadeIn>
    <span class="section-label">Experience</span>
    <h2>Career <span class="gradient-text">timeline</span></h2>
    <p>Roles where I've owned architecture decisions, production reliability, and cross-team delivery.</p>
  </div>

  <div class="timeline" motionTimeline>
    <div class="timeline-line"></div>

    <div class="timeline-item" *ngFor="let exp of experiences">
      <div class="timeline-dot"></div>

      <div class="timeline-content glass-panel">
        <div class="timeline-header">
          <div>
            <h3>{{ exp.role }}</h3>
            <span class="timeline-company">{{ exp.company }}</span>
          </div>
          <span class="timeline-date">{{ exp.period }}</span>
        </div>

        <ul class="timeline-desc-list">
          <li *ngFor="let point of exp.description">{{ point }}</li>
        </ul>

        <div class="timeline-tags">
          <span class="timeline-tag" *ngFor="let tag of exp.tags">{{ tag }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
