<section id="projects" class="projects">
  <div class="section-header" motionFadeIn>
    <span class="section-label">Work</span>
    <h2>Selected <span class="gradient-text">projects</span></h2>
    <p>Production systems I've designed, built, and maintained across enterprise domains.</p>
  </div>

  <div class="projects-grid" motionStagger [motionStaggerDelay]="0.08">
    <div class="project-card glass-panel" *ngFor="let project of projects" motionHover>
      <div class="project-image-container">
        <img [src]="project.imageUrl" [alt]="project.title" class="project-image" loading="lazy">
        <span class="project-category-badge">{{ project.category }}</span>
      </div>

      <div class="project-info">
        <h3>{{ project.title }}</h3>
        <p class="project-desc">{{ project.description }}</p>

        <div class="project-tech-tags">
          <span class="tech-tag" *ngFor="let t of project.tech">{{ t }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
